[package]
name = "hfmd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hugging Face Modules Downloader —— 多线程、断点续传、完整性校验"
repository = "https://github.com/praise579/hfmd"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
hf-hub = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
